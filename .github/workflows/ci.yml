name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: ./scripts/check.sh

  linux-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Creme
        uses: actions/checkout@v4
        with:
          path: workspace/creme
      - name: Check out Jaune
        uses: actions/checkout@v4
        with:
          repository: skbaek/jaune
          ref: ae1b7d51f79205a15fc946034b4fb18085dcddad
          path: workspace/jaune
      - name: Check out Blanc
        uses: actions/checkout@v4
        with:
          repository: skbaek/blanc
          ref: 18ca2b4310688465300378067b3a76f9bfadf4a5
          path: workspace/blanc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Bind uvx to Creme's trusted path
        shell: bash
        env:
          UVX_PATH: ${{ steps.setup-uv.outputs.uvx-path }}
        run: |
          set -euo pipefail
          install -d -m 0755 "$HOME/.local/bin"
          test -x "$UVX_PATH"
          ln -s "$UVX_PATH" "$HOME/.local/bin/uvx"
          test "$(readlink -f "$HOME/.local/bin/uvx")" = "$(readlink -f "$UVX_PATH")"
          "$HOME/.local/bin/uvx" --version
      - name: Exercise fresh Linux sibling layout
        working-directory: workspace/creme
        shell: bash
        run: |
          set -euo pipefail
          export XDG_STATE_HOME="$RUNNER_TEMP/creme-state"
          python3 -m creme platform
          python3 -m creme init --workspace-root ..
          python3 -m creme init --workspace-root .. --write
          python3 -m creme validate-profile
          python3 -m creme doctor --workspace-root .. --json
          python3 -m creme telemetry
          python3 -m creme tempdir --create --prefix creme-ci-
          python3 -m creme cache-copy config "$RUNNER_TEMP/creme-cache-copy"
          python3 -m creme cache-copy config "$RUNNER_TEMP/creme-cache-copy" --execute
          diff -r config "$RUNNER_TEMP/creme-cache-copy"
          python3 -m creme semaphore soft-acquire creme-linux-ci --note "Linux runtime acceptance"
          python3 -m creme semaphore status
          python3 -m creme semaphore soft-release creme-linux-ci
          set +e
          python3 -m creme reclaim --dry-run > "$RUNNER_TEMP/creme-reclaim.json"
          reclaim_status=$?
          set -e
          cat "$RUNNER_TEMP/creme-reclaim.json"
          test "$reclaim_status" -eq 0
          python3 - "$RUNNER_TEMP/creme-reclaim.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              result = json.load(stream)
          expected = {
              "adapter": "Linux",
              "capability": "lean_reclaim",
              "status": "OK",
          }
          for key, value in expected.items():
              if result.get(key) != value:
                  raise SystemExit(f"reclaim {key} mismatch: {result.get(key)!r}")
          data = result.get("data")
          if not isinstance(data, dict):
              raise SystemExit("reclaim data is not an object")
          if data.get("dry_run") is not True:
              raise SystemExit("reclaim did not report an exact dry run")
          for key in ("owned", "termination_order"):
              if data.get(key) != []:
                  raise SystemExit(f"reclaim {key} is not empty: {data.get(key)!r}")
          PY
          ./scripts/check.sh
          test -z "$(git status --short)"
